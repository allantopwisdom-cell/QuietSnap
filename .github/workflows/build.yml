name: Build QuietSnap

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/roothide/theos

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${GITHUB_RUN_NUMBER}"
          echo "Using version: $VERSION"
          sed -i "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          sh build.sh roothide
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f -print

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-roothide
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "静默快拍 v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
